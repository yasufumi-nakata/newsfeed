[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-news-signage"
version = "0.1.0"
description = "Fetch RSS/Atom feeds and serve an auto-updating news signage screen."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Yasufumi Nakata" }]
keywords = ["rss", "atom", "news", "signage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.scripts]
rss-news = "rss_news:main"
rss-signage = "rss_signage:main"

[project.urls]
Repository = "https://github.com/yasufumi-nakata/newsfeed"
Issues = "https://github.com/yasufumi-nakata/newsfeed/issues"

[tool.setuptools]
py-modules = ["rss_feed", "rss_news", "rss_signage"]

